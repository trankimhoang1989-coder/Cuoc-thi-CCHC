<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống theo dõi tiến độ công việc</title>
    <!-- Thêm icon cho web -->
    <link rel="icon" href="data:,"> 
    <style>
        /* Xóa mọi khoảng trắng và ẩn thanh cuộn của trang web ngoài */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; 
            background-color: #f3f6f9; /* Màu nền đồng bộ với hệ thống */
            font-family: Arial, sans-serif;
        }

        /* Định dạng iframe phủ kín toàn bộ màn hình */
        .app-iframe {
            width: 100vw;
            height: 100vh;
            border: none;
            display: block;
            position: relative;
            z-index: 2;
        }

        /* Màn hình chờ tải trang (Loading) */
        .loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1;
            color: #0056b3;
        }

        .spinner {
            border: 4px solid rgba(0, 86, 179, 0.1);
            border-left-color: #0056b3;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Màn hình chờ hiển thị trong lúc Google Script đang tải -->
    <div class="loading-screen">
        <div class="spinner"></div>
        <h4>Đang kết nối đến hệ thống...</h4>
    </div>

    <!-- Nhúng đường link Google Apps Script vào đây -->
    <iframe 
        class="app-iframe" 
        src="https://script.google.com/macros/s/AKfycbwCmGpmXlGX-reKenSJQ5wCS6GjtOoJMQFL__7tvgBOXaT3LmfdVlF_-iKZpPqGMjkK/exec" 
        allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" 
        allowfullscreen>
    </iframe>

</body>
</html>
